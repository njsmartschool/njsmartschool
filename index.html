<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>NJ Smart Learning</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8f5ff;--bg2:#cfe9fb;--card:#fff;--ink:#0b2a5b;--mut:#5b6b8a;--pri:#1d6fe0;--sky:#38bdf8;--bar:#0b2a5b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1730;--bg2:#0f2347;--card:#14284d;--ink:#eaf2ff;--mut:#9db3d8;--bar:#06101f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1730;--bg2:#0f2347;--card:#14284d;--ink:#eaf2ff;--mut:#9db3d8;--bar:#06101f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;font-family:Nunito,Segoe UI,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg),var(--bg2));min-height:100vh;padding-bottom:84px}
h1,h2,h3,.fh{font-family:'Baloo 2',Nunito,sans-serif;margin:0}
button{font:inherit;cursor:pointer;border:0}button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--bar);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.logo{display:flex;align-items:center;gap:8px;font-family:'Baloo 2';font-weight:800;font-size:20px}
.logo i{font-style:normal;background:linear-gradient(135deg,#38bdf8,#1d6fe0);border-radius:12px;padding:3px 8px}
header .sp{flex:1}.ib{background:#ffffff22;color:#fff;border-radius:12px;padding:8px 12px}
main{max-width:1000px;margin:0 auto;padding:18px 14px}
.ttl{text-align:center;font-size:clamp(26px,5vw,38px);margin:10px 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.gc{border-radius:26px;padding:18px 8px;text-align:center;color:var(--ink);border:4px solid var(--c);background:color-mix(in srgb,var(--c) 22%,var(--card));font-family:'Baloo 2';font-weight:700;font-size:18px;transition:transform .15s}
.gc:hover{transform:translateY(-4px) scale(1.03)}.gc .e{font-size:54px;display:block}.gc small{display:block;font-family:Nunito;font-weight:500;font-size:12px;color:var(--mut)}
.gc.off{opacity:.55;border-style:dashed}
.bc{background:var(--card);border-radius:18px;padding:12px;text-align:center;box-shadow:0 8px 24px #0b2a5b22}
.cov{aspect-ratio:3/4;border-radius:6px 14px 14px 6px;background:linear-gradient(150deg,var(--c),#0b2a5b);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px;box-shadow:inset 8px 0 0 #0004;font-family:'Baloo 2';font-weight:800;text-align:center}
.cov b{font-size:60px;font-weight:400}.cov span{font-size:13px;opacity:.9}.cov em{font-style:normal;font-size:11px;background:#fff3;border-radius:8px;padding:2px 8px}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}.bar h2{flex:1}
.btn{background:var(--pri);color:#fff;border-radius:14px;padding:10px 18px;font-weight:700}.btn.g{background:var(--card);color:var(--ink);box-shadow:0 2px 8px #0b2a5b22}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;gap:8px;justify-content:center;padding:10px 8px calc(10px + env(safe-area-inset-bottom,0px));background:#ffffffcc;backdrop-filter:blur(8px);z-index:20;overflow-x:auto}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav{background:#06101fcc}}:root[data-theme="dark"] nav{background:#06101fcc}
nav button{color:#fff;border-radius:999px;padding:10px 16px;font-weight:800;white-space:nowrap;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.st{background:var(--card);border-radius:18px;padding:14px;box-shadow:0 6px 18px #0b2a5b1a}.st b{font-family:'Baloo 2';font-size:30px;display:block}.st span{color:var(--mut);font-size:13px}
.ch{background:var(--card);border-radius:18px;padding:16px;margin-top:14px;box-shadow:0 6px 18px #0b2a5b1a}
.bars{display:flex;align-items:flex-end;gap:8px;height:140px;margin-top:8px}.bars div{flex:1;background:linear-gradient(var(--sky),var(--pri));border-radius:8px 8px 0 0;position:relative;min-height:6px}.bars small{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:10px;color:var(--mut)}
.don{width:110px;height:110px;border-radius:50%;background:conic-gradient(#22c55e 0 29%,#ef4444 0);display:grid;place-items:center}.don span{background:var(--card);border-radius:50%;width:70px;height:70px;display:grid;place-items:center;font-weight:800}
.note{font-size:12px;color:var(--mut);margin-top:10px}
/* reader */
.stage{display:grid;place-items:center;padding:10px 0;perspective:2200px}
.book{container-type:inline-size;position:relative;width:min(94vw,820px);aspect-ratio:3/2;transform:scale(var(--z,1));transition:transform .2s}
.leaf{position:absolute;left:50%;top:0;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.6,.1,.2,1)}
.leaf.f{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;overflow:hidden;background:#fffdf6;box-shadow:0 10px 30px #0b2a5b44}.face.bk{transform:rotateY(180deg)}
.pg{height:100%;padding:3.5cqw;font-size:2.1cqw;color:#0b2a5b;display:flex;flex-direction:column;gap:1.4cqw;position:relative;font-family:Nunito}
.pg h3{font-size:3cqw;color:#c2185b}.pn{position:absolute;bottom:1.2cqw;font-size:1.8cqw;opacity:.6}.pg:nth-child(n) .pn{right:2cqw}
.big{font-family:'Baloo 2';font-weight:800;font-size:13cqw;line-height:1;color:#e53935;text-align:center}
.its{display:flex;flex-wrap:wrap;gap:1.5cqw;justify-content:center}
.it{background:#fff;border:.4cqw solid #fbbf24;border-radius:2cqw;padding:1.2cqw 2cqw;font-size:2cqw;text-align:center;color:#0b2a5b;font-weight:700}.it b{display:block;font-size:6cqw;font-weight:400}
.it:hover{background:#fff7d6}.bn{animation:bn .6s}@keyframes bn{30%{transform:scale(1.25) rotate(-6deg)}60%{transform:scale(.95)}}
.ab{display:flex;align-items:center;gap:1.2cqw;border-radius:2cqw;padding:1.5cqw 2cqw;color:#fff;font-weight:800;font-size:2.3cqw;text-align:left;width:100%}
.tn{margin-top:auto;background:#fff3cd;border:.3cqw solid #f5b700;border-radius:1.5cqw;padding:1cqw 1.6cqw;font-size:1.7cqw;margin-bottom:3cqw}
.ctl{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin:6px 0}
.ctl button{background:var(--card);color:var(--ink);border-radius:12px;padding:9px 14px;font-weight:700;box-shadow:0 2px 8px #0b2a5b22}
.open{position:absolute;inset:auto 0 -4px;margin:auto;width:max-content}
.md{position:fixed;inset:0;background:#000a;z-index:50;display:grid;place-items:center;padding:14px}
.mb{background:var(--card);border-radius:22px;padding:20px;width:min(94vw,480px);max-height:90vh;overflow:auto;position:relative}
.mb .x{position:absolute;top:8px;right:8px;background:#e5393522;color:#e53935;border-radius:50%;width:34px;height:34px}
.ch2{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:12px 0}.ch2 button{font-size:44px;background:#fff;border:3px solid #cfe3f7;border-radius:18px;padding:8px 16px}
canvas{background:#fff;border-radius:14px;border:3px solid var(--sky);touch-action:none;max-width:100%}
input,select{font:inherit;width:100%;padding:10px;border-radius:10px;border:2px solid #b6d4f2;margin:4px 0 8px;background:var(--card);color:var(--ink)}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#16a34a;color:#fff;padding:10px 18px;border-radius:12px;z-index:90;font-weight:700}
.sw{display:flex;gap:8px;justify-content:center}.sw i{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #0004;cursor:pointer}
.fl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;align-items:end}.fl input,.fl select{margin:0}
.ring{position:relative;transform-style:preserve-3d;animation:rot 24s linear infinite}.ring:hover{animation-play-state:paused}@keyframes rot{to{transform:rotateY(360deg)}}
.trb{position:absolute;left:3%;top:3%;background:#fff6b3;border:0;border-radius:2cqw;padding:1cqw 1.6cqw;font-size:1.8cqw;color:#0b2a5b;font-weight:700;text-align:center}
.lo{position:absolute;right:3%;top:3%;width:46%;background:#fffffff0;border-radius:1.5cqw;padding:1cqw 1.4cqw;font-size:1.5cqw}
.vb{position:absolute;right:3%;top:26%;background:#e53935;color:#fff;border-radius:1.5cqw;padding:.8cqw 1.4cqw;font-size:1.8cqw;font-weight:800}
.si{position:absolute;background:none;border:0;text-align:center}.si b{display:block;font-size:13cqw;font-weight:400;filter:drop-shadow(0 .6cqw .6cqw #0006)}.si span{background:#fff;border-radius:2cqw;padding:.5cqw 1.8cqw;font-size:2.4cqw;font-weight:800;color:#0b2a5b}
.sn{position:absolute;left:3%;right:3%;bottom:4%;background:#fff;border-radius:2cqw;padding:1.2cqw 2cqw;font-size:2cqw;font-weight:700}
.fx{position:absolute;pointer-events:none;font-size:4cqw;animation:fl .8s forwards;z-index:5}@keyframes fl{to{transform:translateY(-8cqw) scale(1.6);opacity:0}}
@keyframes jmp{40%{transform:translateY(-4cqw) scale(1.2)}}@keyframes wig{25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}@keyframes chm{30%{transform:scale(1.35) rotate(8deg)}60%{transform:scale(.9)}}
.a0 b{animation:jmp .7s}.a1 b{animation:wig .7s}.a2 b{animation:chm .7s}.pp{animation:jmp .7s}
.rr{display:flex;gap:1.5cqw}.bx{flex:1;border:.4cqw solid var(--bc);border-radius:2cqw;overflow:hidden;background:#fff}.bx h4{margin:0;background:var(--bc);color:#fff;padding:1cqw;font-size:1.7cqw}.bx div{display:flex;justify-content:center;gap:1cqw;padding:1cqw}.bx button{background:none;border:0;font-size:8cqw;line-height:1}.lin{filter:grayscale(1) contrast(3) brightness(1.3)}
.stm{background:#fffbe0;border-radius:2cqw;padding:1cqw}.cols{display:flex;gap:.6cqw}.col{flex:1;border:.3cqw solid var(--c);border-radius:1.5cqw;background:#fff;text-align:center;padding:.6cqw;font-size:1.25cqw;display:flex;flex-direction:column;align-items:center;gap:.4cqw}.col i{font-style:normal;background:var(--c);color:#fff;border-radius:50%;width:3cqw;height:3cqw;display:grid;place-items:center;font-size:2cqw}.col b{color:var(--c);font-size:1.5cqw}.col p{margin:0}.col button{background:none;border:0;font-size:4cqw;margin-top:auto;line-height:1.1;word-break:break-all}
.arb{position:absolute;transform:translate(-50%,-50%);background:#ffffffcc;border:3px solid #be185d;border-radius:50%;line-height:1;cursor:pointer;padding:0}.arb.on{animation:arj .7s}@keyframes arj{40%{transform:translate(-50%,-50%) scale(1.5) rotate(10deg)}}
.pt{cursor:pointer;transform-box:fill-box;transform-origin:center}.pop{animation:ppo .6s}@keyframes ppo{40%{transform:scale(1.25) rotate(6deg)}}
@media print{body>*:not(main),main>*:not(#po){display:none!important}}
@media (prefers-reduced-motion:reduce){.leaf{transition:none}.bn,.ring{animation:none}}
</style></head><body>
<header><div class="logo"><i>🎓</i>NJ Smart Learning</div><span class="sp"></span><button class="ib" onclick="go('home')">🏠 Home</button><button class="ib" id="mu" onclick="mute()">🔊</button><button class="ib" onclick="theme()">🌓</button></header>
<main id="app"></main>
<nav>
<button style="background:#16a34a" onclick="go('res')">📚 Resources</button>
<button style="background:#f59e0b" onclick="go('tools')">🛠 NJ Tools</button>
<button style="background:#2563eb" onclick="go('ai')">🧠 NJ AI</button>
<button style="background:#dc2626" onclick="go('dash')">🏫 School Management</button>
<button style="background:#7c3aed" onclick="go('paper')">📝 Paper Maker</button>
<button style="background:#0d9488" onclick="go('sim')">🧬 Simulations</button>
<button style="background:#be185d" onclick="go('scan')">📷 Scanner</button></nav>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const ST=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};
const G=[['Playgroup','🧸','#60a5fa'],['Nursery','☀️','#fbbf24'],['Prep','🧱','#4ade80'],['Grade 1','✏️','#fb923c'],['Grade 2','📖','#3b82f6'],['Grade 3','🌍','#14b8a6'],['Grade 4','💻','#a855f7'],['Grade 5','🏆','#ef4444']];
const S={English:['🔤','#2563eb'],Urdu:['📜','#059669'],Maths:['➕','#ea580c'],Science:['🔬','#0891b2'],GK:['🌟','#9333ea']};
const EN=[['A',[['🍎','apple'],['🐜','ant'],['🪓','axe']]],['B',[['⚽','ball'],['🦇','bat'],['🚌','bus']]],['C',[['🐱','cat'],['🎂','cake'],['🐄','cow']]],['D',[['🐶','dog'],['🪆','doll'],['🦆','duck']]],['E',[['🥚','egg'],['🐘','elephant'],['👂','ear']]],['F',[['🐟','fish'],['🌸','flower'],['🐸','frog']]]];
const UR=[['ا',[['🥭','آم'],['🍎','انار'],['🍇','انگور']]],['ب',[['🦆','بطخ'],['🐐','بکری'],['🐱','بلی']]],['پ',[['🌸','پھول'],['🪁','پتنگ'],['✏️','پنسل']]],['ت',[['🦋','تتلی'],['🍉','تربوز'],['⭐','تارا']]]];
const SCI=[['🌱',[['🌱','plant'],['💧','water'],['☀️','sun']]],['🐾',[['🐶','dog'],['🐦','bird'],['🐟','fish']]],['🌦️',[['☁️','cloud'],['🌧️','rain'],['🌈','rainbow']]]];
const GK=[['🎨',[['🔴','red'],['🟡','yellow'],['🟢','green']]],['🍓',[['🍌','banana'],['🍊','orange'],['🍓','strawberry']]],['🦁',[['🦁','lion'],['🐘','elephant'],['🐒','monkey']]]];
const NW=['zero','one','two','three','four','five','six','seven','eight','nine','ten'];
function topics(b){const a=tps(b);if(b.k===undefined)return a;const h=Math.ceil(a.length/2);return b.k?a.slice(h):a.slice(0,h)}
function tps(b){const s=b.s,g=b.g;if(s=='English')return g<3?ABC:WF;if(s=='Urdu')return UR;if(s=='Science')return SCI;if(s=='GK')return GK;
 const r=[];for(let i=1;i<=6;i++){if(g<3)r.push([String(i),[['⭐'.repeat(i),NW[i]]]]);else{const a=i+g,c=i+1;r.push([a+' + '+c,[['🔵'.repeat(a),NW[a]||String(a)],['🟠'.repeat(c),NW[c]||String(c)],['🟢'.repeat(Math.min(a+c,10)),NW[a+c]||String(a+c)]]])}}return r}
let books=[];G.forEach((g,gi)=>Object.keys(S).forEach(s=>[0,1].forEach(k=>books.push({id:gi+'-'+s+'-'+k,g:gi,s,k,title:'NJ Smart '+s+' Book '+(k+1)+' – '+g[0]}))));
(ST('custom')||[]).forEach(b=>books.push(b));
let muted=false,ctx,cur,tp,pages,t=0,N=0,zoom=1;
function beep(f=600,d=.12){if(muted)return;try{ctx=ctx||new AudioContext();const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;g.gain.value=.07;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+d)}catch(e){}}
function say(w,l){if(muted||!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang=l;u.rate=.8;speechSynthesis.speak(u)}
function mute(){muted=!muted;$('#mu').textContent=muted?'🔇':'🔊';if(muted&&window.speechSynthesis)speechSynthesis.cancel()}
function theme(){const r=document.documentElement;r.dataset.theme=(r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))=='dark'?'light':'dark'}
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.append(d);setTimeout(()=>d.remove(),2200)}
function soon(n){toast(n+' – coming soon (agla module)')}
const esc=s=>{const d=document.createElement('div');d.textContent=s;return d.innerHTML};
function modal(h){const m=document.createElement('div');m.className='md';m.innerHTML='<div class="mb"><button class="x" aria-label="Close">✕</button>'+h+'</div>';m.onclick=e=>{if(e.target==m||e.target.className=='x')m.remove()};document.body.append(m);return m}
function go(v,a,b){PL=0;if(typeof camOff=='function')camOff();if(window.speechSynthesis)speechSynthesis.cancel();document.onkeydown=null;({home,dash,subj,lib,reader,res,tools,ai,paper,sim,plant,scan})[v](a,b);scrollTo(0,0)}
function home(){app.innerHTML='<h1 class="ttl">Choose Your Grade!</h1><div class="grid">'+G.map((g,i)=>`<button class="gc" style="--c:${g[2]}" onclick="go('subj',${i})"><span class="e">${g[1]}</span>${g[0]}<small>${books.filter(b=>b.g==i).length} books · ${Object.keys(S).length} subjects</small></button>`).join('')+'<button class="gc off" style="--c:#94a3b8" onclick="soon(\'Grade 6–12 (simulators)\')"><span class="e">🧪</span>Grade 6–12<small>Coming soon</small></button></div>'}
function subj(g){app.innerHTML=`<div class="bar"><button class="btn g" onclick="go('home')">← Grades</button><h2>${G[g][1]} ${G[g][0]} – Choose Your Subject</h2></div><div class="grid">`+Object.entries(S).map(([s,v])=>`<button class="gc" style="--c:${v[1]}" onclick="go('lib',${g},'${s}')"><span class="e">${v[0]}</span>${s}<small>${books.filter(b=>b.g==g&&b.s==s).length} book(s)</small></button>`).join('')+'</div>'}
function lib(g,s){const bs=books.filter(b=>b.g==g&&b.s==s);app.innerHTML=`<div class="bar"><button class="btn g" onclick="go('subj',${g})">← Subjects</button><h2>${s} · ${G[g][0]}</h2><button class="btn" onclick="addBook(${g},'${s}')">＋ Add book</button></div><div class="grid">`+bs.map(b=>`<div class="bc"><div class="cov" style="--c:${S[s][1]}"><b>${S[s][0]}</b>${esc(b.title)}<span>NJ Smart Publisher</span><em>${topics(b).length*2+2} pages</em></div><button class="btn" style="margin-top:10px;width:100%" onclick="go('reader','${b.id}')">📖 Open book</button></div>`).join('')+'</div>'}
function addBook(g,s){const m=modal(`<h2>New ${esc(s)} book</h2><p class="note">Lessons aur pages khud generate honge. Book is device mein save hogi (demo).</p><label>Book title<input id="bt" value="NJ Smart ${s} Book 2 – ${G[g][0]}"></label><button class="btn" id="sv">Generate &amp; save</button>`);m.querySelector('#sv').onclick=()=>{const v=m.querySelector('#bt').value.trim();if(!v){toast('Title likhein');return}const b={id:'c'+Date.now(),g,s,title:v};books.push(b);const c=ST('custom')||[];c.push(b);ST('custom',c);m.remove();toast('Book add ho gayi ✓');lib(g,s)}}
function lesson(x,i){if(x[2])return sceneL(x,i);const l=cur.s=='Urdu'?'ur-PK':'en-US';return `<div class="pg"><h3>${cur.s=='Maths'?'Let’s count':'Exploring “'+esc(x[0])+'”'}</h3><div class="big">${esc(x[0])}</div><div class="its">`+x[1].map(it=>`<button class="it" onclick="say('${it[1]}','${l}');this.classList.remove('bn');void this.offsetWidth;this.classList.add('bn')"><b>${it[0]}</b>${it[1]}</button>`).join('')+`</div><div class="tn">👆 Tap letter, word aur picture – awaaz aur animation.</div><span class="pn" style="left:2cqw">${2*i+2}</span></div>`}

async function camOn(){try{camOff();SC.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const v=$('#vv');v.srcObject=SC.stream;await v.play();SC.on=1;loop()}catch(e){toast('Camera nahi khuli – HTTPS aur permission check karein')}}

function loop(){if(!SC.on)return;const v=$('#vv');if(!v){camOff();return}if(v.videoWidth&&window.jsQR){const s=Math.min(1,640/v.videoWidth),c=document.createElement('canvas');c.width=v.videoWidth*s;c.height=v.videoHeight*s;const g=c.getContext('2d');g.drawImage(v,0,0,c.width,c.height);const d=g.getImageData(0,0,c.width,c.height),r=jsQR(d.data,c.width,c.height);if(r){SC.last=Date.now();hit(r,v.clientWidth/c.width)}else if(Date.now()-SC.last>1200&&SC.key){SC.key='';$('#ov').innerHTML=''}}setTimeout(loop,150)}

if(SC.key!=r.data){SC.key=r.data;ov.innerHTML=x[1].map((a,j)=>`<button class="arb" data-j="${j}">${a[0]}</button>`).join('');ov.querySelectorAll('.arb').forEach(el=>el.onclick=()=>{const j=+el.dataset.j;say(x[1][j][1],'en-US');beep(600+j*100,.1);el.classList.remove('on');void el.offsetWidth;el.classList.add('on');$('#st').textContent='👆 '+x[1][j][1]});$('#st').innerHTML='✅ '+esc(bk.title)+' · page '+(p||1)+' – pictures par touch karein. <button class="btn g" onclick="go(\'reader\',\''+bk.id+'\','+(p||1)+')">Open in app</button>'}
